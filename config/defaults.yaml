chat_agent:
  provider: anthropic
  model: claude-haiku-4-5-20251001    # fast + cheap for conversational turns
  temperature: 0.2
  max_iterations: 10

image_analyzer:
  provider: google
  model: gemini-2.5-flash
  temperature: 0.1      # low = deterministic OCR extraction

server:
  host: "0.0.0.0"
  port: 8001
  cors_origins:
    - "*"

auth:
  db_path: "splitpro.db"
