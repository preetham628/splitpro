[project]
name = "splitpro"
version = "0.1.0"
description = "Smart bill splitting app with category-based splits"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langchain-openai>=0.1.0",
    "langchain>=0.1.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
bedrock = ["langchain-aws>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
