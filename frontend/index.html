<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitPro</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- Login overlay (shown when not authenticated) -->
  <div class="login-overlay" id="login-overlay">
    <div class="login-card">
      <span class="login-logo">🧾</span>
      <h1>SplitPro</h1>
      <p>Sign in to split bills with friends</p>
      <a href="/auth/google" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        Sign in with Google
      </a>
    </div>
  </div>

  <div class="app" id="app" style="display:none">

    <header class="header">
      <div class="header-left">
        <span class="logo">🧾</span>
        <h1>SplitPro</h1>
      </div>
      <div class="header-right">
        <span class="provider-badge" id="provider-badge">–</span>
        <div class="user-info" id="user-info">
          <img class="user-avatar" id="user-avatar" src="" alt="" />
          <span class="user-name" id="user-name"></span>
          <button class="logout-btn" id="logout-btn">Sign out</button>
        </div>
      </div>
    </header>

    <main class="main">

      <!-- Session sidebar -->
      <aside class="session-sidebar" id="session-sidebar">
        <div class="session-sidebar-header">
          <span class="sidebar-title">Sessions</span>
          <button class="new-session-btn" id="new-session-btn" title="New session">+</button>
        </div>
        <ul class="session-list" id="session-list"></ul>
      </aside>

      <!-- Chat panel -->
      <section class="chat-panel">
        <div class="messages" id="messages">
          <div class="welcome" id="welcome-msg">
            <p>Select a session or create a new one.</p>
          </div>
        </div>

        <div class="input-area">
          <label class="attach-btn" title="Upload receipt image">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.64 17.2
                       a2 2 0 0 1-2.83-2.83l8.49-8.49"/>
            </svg>
            <input type="file" id="file-input" accept="image/*" hidden />
          </label>

          <textarea
            id="message-input"
            placeholder="Paste a bill or type a message…"
            rows="1"
          ></textarea>

          <button class="send-btn" id="send-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </section>

      <!-- Bill state sidebar -->
      <aside class="state-panel">
        <h2>Session</h2>
        <div id="state-content">
          <p class="muted">No data yet.</p>
        </div>
      </aside>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
