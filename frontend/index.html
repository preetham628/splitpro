<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitPro</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="header-left">
        <span class="logo">🧾</span>
        <h1>SplitPro</h1>
      </div>
      <span class="provider-badge" id="provider-badge">–</span>
    </header>

    <main class="main">

      <!-- Chats sidebar -->
      <aside class="chats-panel" id="chats-panel">
        <div class="chats-panel-header">
          <span class="chats-panel-title">Chats</span>
          <button class="new-chat-btn" id="new-chat-btn" title="New chat">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
        <div class="chat-list" id="chat-list"></div>
      </aside>

      <!-- Chat panel -->
      <section class="chat-panel">
        <div class="messages" id="messages">
          <div class="welcome">
            <p>Connecting to agent…</p>
          </div>
        </div>

        <div class="input-area">
          <label class="attach-btn" title="Upload receipt image">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.64 17.2
                       a2 2 0 0 1-2.83-2.83l8.49-8.49"/>
            </svg>
            <input type="file" id="file-input" accept="image/*" hidden />
          </label>

          <textarea
            id="message-input"
            placeholder="Paste a bill or type a message…"
            rows="1"
          ></textarea>

          <button class="send-btn" id="send-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </section>

      <!-- State sidebar -->
      <aside class="state-panel">
        <h2>Session</h2>
        <div id="state-content">
          <p class="muted">No data yet.</p>
        </div>
      </aside>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
